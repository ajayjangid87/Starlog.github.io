<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Star Log</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EAF2FF; --card:#FFFFFF; --ink:#1B2150; --muted:#566093; --line:#D6E1FA; --soft:#F1F6FF;
  --red:#E5382B; --yel:#FFC93C; --teal:#0A8577; --blue:#2F6BFF; --pur:#6A4BEF; --pink:#D63D78; --grn:#1E8F55; --navy:#141A55;
  --good:#17803F; --bad:#C62828;
  --font:ui-rounded,'SF Pro Rounded','Arial Rounded MT Bold','Nunito','Trebuchet MS',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B0F33; --card:#171D50; --ink:#EEF1FF; --muted:#AEB5DE; --line:#2A3376; --soft:#1F2760;
    --good:#5FDB8D; --bad:#FF8A80;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0F33; --card:#171D50; --ink:#EEF1FF; --muted:#AEB5DE; --line:#2A3376; --soft:#1F2760;
  --good:#5FDB8D; --bad:#FF8A80;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.35;-webkit-tap-highlight-color:transparent}
#app{max-width:760px;margin:0 auto;padding-bottom:104px}
button{font-family:inherit;color:inherit}
h1,h2,h3,p{margin:0}

/* ---------- scenes (cartoon banners) ---------- */
.scene{position:relative;overflow:hidden;border-radius:0 0 30px 30px;background:var(--navy)}
.scene svg{display:block;width:100%;height:clamp(180px,34vw,250px)}
.head{padding:18px 18px 4px}
.head h1{font-size:clamp(30px,8vw,44px);font-weight:700;line-height:1.05;letter-spacing:-.01em}
.head h2{font-size:clamp(26px,7vw,36px);font-weight:700;line-height:1.1}
.head h2.long{font-size:clamp(21px,5.8vw,30px)}
.head p{color:var(--muted);margin-top:6px;font-size:17px;max-width:46ch}
.head .love{color:var(--ink);font-weight:500}
.wrap{padding:14px 16px 0;display:grid;gap:14px}

/* ---------- cards ---------- */
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px}
.card h3{font-size:20px;font-weight:600;margin-bottom:10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:22px;padding:14px 14px 14px;color:#fff;position:relative;overflow:hidden;min-height:128px;display:flex;flex-direction:column;justify-content:space-between}
.tile .lab{font-size:17px;font-weight:600}
.tile .num{font-size:clamp(30px,8.4vw,42px);font-weight:700;line-height:1;letter-spacing:-.01em;margin-top:6px}
.tile .sub{font-size:14px;font-weight:500;opacity:.95;margin-top:6px}
.tile .em{position:absolute;right:10px;top:8px;font-size:30px}
.t-pts{background:#2F6BFF}
.t-val{background:#0A8577}
.t-pig{background:#D63D78}
.t-money{grid-column:1/-1;background:linear-gradient(120deg,#E5382B,#F26B1D);min-height:0;flex-direction:row;align-items:center;gap:14px}
.t-money .num{font-size:clamp(40px,12vw,58px)}
.t-money .em{position:static;font-size:52px;line-height:1}
.sumline{display:flex;flex-wrap:wrap;gap:6px 10px;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;background:rgba(255,255,255,.22);font-size:15px;font-weight:600}

.cheer{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:2px dashed var(--line)}
.cheer:first-of-type{border-top:0}
.cheer .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--soft);flex:none}
.cheer .tx{flex:1;min-width:0}
.cheer .tx b{display:block;font-weight:600}
.cheer .tx span{color:var(--muted);font-size:14px}
.cheer .pts{font-weight:700;color:var(--good);white-space:nowrap}
.empty{color:var(--muted);padding:6px 0}
.chipwho{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:13px;font-weight:700;color:#fff;margin-right:6px;vertical-align:1px}
.who-m{background:#D63D78}.who-b{background:#2F6BFF}

/* ---------- log table ---------- */
.grp{background:var(--card);border:2px solid var(--line);border-radius:22px;overflow:hidden}
.gh{background:var(--g);color:#fff;padding:10px 14px 0;display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-weight:600;font-size:19px}
.gh b{font-size:15px;font-weight:600;white-space:nowrap}
.bar{height:8px;background:rgba(255,255,255,.28);margin-top:10px;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:#fff;border-radius:0 6px 6px 0}
.row{display:grid;grid-template-columns:1fr 46px 56px 56px 62px;gap:4px;align-items:center;padding:9px 12px;border-top:1px solid var(--line);font-size:16px}
.row.hd{font-size:13px;color:var(--muted);font-weight:600;border-top:0;padding-top:8px;padding-bottom:4px}
.row span:nth-child(n+2){text-align:right;font-variant-numeric:tabular-nums}
.row .nm{display:flex;gap:8px;align-items:center;min-width:0;line-height:1.15}
.row .nm em{font-style:normal;font-size:20px;flex:none}
.row .tot{font-weight:700}
.rowbtn{width:100%;background:transparent;border:0;border-top:1px solid var(--line);text-align:left;color:inherit;font-family:inherit;cursor:pointer}
.rowbtn:hover{background:var(--soft)}
.rowbtn:focus-visible{outline:3px solid var(--yel);outline-offset:-3px}
.bank{display:grid;gap:0}
.bank .b{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:2px dashed var(--line);font-weight:500}
.bank .b:first-child{border-top:0}
.bank .b b{font-weight:700;text-align:right}
.bank .b.last{font-size:19px}

/* ---------- forms ---------- */
.lbl{font-weight:600;margin:14px 0 8px;font-size:18px}
.lbl:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--soft);border-radius:999px;padding:9px 14px;font-size:16px;font-weight:500;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible,.btn:focus-visible,.tab:focus-visible,.iconbtn:focus-visible,input:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.whobtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.whobtn{border:3px solid var(--line);background:var(--soft);border-radius:20px;padding:12px;font-size:20px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;min-height:60px}
.whobtn .chipwho{width:34px;height:34px;font-size:19px;margin:0}
.whobtn.on{border-color:var(--ink);background:var(--card);box-shadow:0 4px 0 var(--ink)}
.field{width:100%;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:11px 14px;font-size:18px;font-family:inherit;min-height:48px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:18px;padding:14px 18px;font-size:19px;font-weight:700;cursor:pointer;min-height:54px;width:100%;color:#fff;background:var(--red);box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.blue{background:var(--blue)}.btn.green{background:var(--grn)}.btn.pur{background:var(--pur)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border:2px solid var(--line);min-height:44px;font-size:16px;width:auto;padding:8px 14px}
.preview{font-weight:600;color:var(--muted);margin-top:8px;min-height:1.4em}
.preview b{color:var(--ink)}
.iconbtn{border:2px solid var(--line);background:var(--soft);border-radius:12px;padding:6px 12px;font-size:15px;font-weight:600;cursor:pointer;min-height:36px}
.lockcard{text-align:center;padding:22px 16px}
.lockcard .big{font-size:64px;line-height:1}
.lockcard h3{font-size:24px;margin:8px 0 4px}
.lockcard p{color:var(--muted);margin-bottom:14px}
.lockcard .field{max-width:240px;text-align:center;font-size:26px;letter-spacing:.3em;margin:0 auto 12px;display:block}
.lockcard .btn{max-width:240px}
.err{color:var(--bad);font-weight:600;min-height:1.3em;margin-bottom:6px}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.undo{border:0;background:transparent;color:var(--muted);text-decoration:underline;font-size:14px;cursor:pointer;padding:6px;min-height:36px}

/* ---------- piggy page ---------- */
.big-pig{display:flex;gap:14px;align-items:center}
.big-pig .amt{font-size:clamp(38px,11vw,54px);font-weight:700;line-height:1}
.big-pig small{display:block;color:var(--muted);font-size:15px;margin-top:6px}
.eq .e{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:2px dashed var(--line)}
.eq .e:first-of-type{border-top:0}
.eq .e .ic{font-size:24px;width:34px;text-align:center;flex:none}
.eq .e .tx{flex:1;min-width:0}
.eq .e .tx span{display:block;color:var(--muted);font-size:14px}
.eq .e .v{font-weight:700;white-space:nowrap}
.plus{color:var(--good)}.minus{color:var(--bad)}
.eq .final{background:var(--ink);color:var(--bg);border-radius:16px;padding:12px;margin-top:6px;border-top:0}
.eq .final .tx span{color:inherit;opacity:.8}
.eq .final .v{font-size:24px}

/* ---------- login / auth / welcome ---------- */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;background:var(--card);border-bottom:2px solid var(--line);font-weight:500}
.topbar .tbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.profiles{display:grid;gap:12px}
.prof{display:flex;align-items:center;gap:14px;text-align:left;width:100%;border:3px solid var(--line);background:var(--card);border-radius:24px;padding:12px 16px;cursor:pointer;min-height:84px;box-shadow:0 4px 0 var(--line)}
.prof:active{transform:translateY(3px);box-shadow:none}
.prof:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.prof .av{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-size:34px;background:var(--soft);flex:none}
.prof .nm2{display:block;font-size:24px;font-weight:700;line-height:1.1}
.prof .sb{display:block;color:var(--muted);font-size:15px;margin-top:2px}
.authcard{text-align:center;padding:22px 16px}
.authcard .big{font-size:56px;line-height:1}
.authcard h3{font-size:24px;margin:8px 0 4px}
.authcard p{color:var(--muted);margin-bottom:14px}
.pinfield{max-width:240px;text-align:center;font-size:26px;letter-spacing:.3em;margin:0 auto 12px;display:block}
.authcard .btn{max-width:260px;margin:0 auto}
.authcard .step{font-size:14px;font-weight:600;color:var(--muted);margin-bottom:6px}
.scene.tall svg{height:clamp(250px,60vw,330px)}
.prof .av .face{width:100%;height:100%;border-radius:50%;display:block;object-fit:cover;background:#FFFCF3}
.topbar .face{width:1.7em;height:1.7em;border-radius:50%;vertical-align:-.5em;object-fit:cover;background:#FFFCF3}
.authcard .big .face{width:96px;height:96px;border-radius:50%;object-fit:cover;background:#FFFCF3;border:3px solid var(--line)}
.mut{color:var(--muted)}
.cardask .two .btn{width:100%}

/* ---------- nav ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:2px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tab{border:0;background:transparent;border-radius:16px;padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;font-size:12.5px;font-weight:600;color:var(--muted);min-height:56px}
.tab span.e{font-size:25px;line-height:1.15}
.tab[aria-current="page"]{background:var(--ink);color:var(--bg)}
.foot{text-align:center;color:var(--muted);font-size:14px;padding:6px 16px 0}

/* ---------- admin ---------- */
.face.initial{display:grid;place-items:center;border-radius:50%;background:var(--c,#2F6BFF);color:#fff;font-weight:700;line-height:1}
.prof .av .face.initial{font-size:30px}
.vh{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden}
.adm-row{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:2px dashed var(--line)}
.adm-row:first-of-type{border-top:0}
.adm-av{width:64px;height:64px;flex:none}
.adm-av .face{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#FFFCF3;font-size:28px}
.adm-f{flex:1;min-width:0}
.adm-b{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
label.iconbtn{display:inline-flex;align-items:center;cursor:pointer}
.chk{display:flex;gap:10px;align-items:center;font-weight:500;min-height:44px}
.chk input{width:22px;height:22px}
.btn.danger{background:#B3261E}
.card.warn{border-color:#E5A19B}
.adj{display:grid;gap:4px;margin-top:8px;font-size:14px;color:var(--muted);font-weight:500}
.adj label{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:8px}
.adj input{width:100%}
.help{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:2px dashed var(--line)}
.help:first-of-type{border-top:0}

/* ---------- celebration vibe ---------- */
.scene svg.bunting{position:absolute;top:0;left:0;width:100%;height:34px;pointer-events:none}
#party{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:15}
#party span{position:absolute;bottom:-50px;opacity:.42;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-118vh) rotate(24deg)}}
.scene .a-nod{transform-box:fill-box;transform-origin:50% 94%;animation:aNod 3.2s ease-in-out infinite}
@keyframes aNod{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.scene .a-drive{animation:aDrive 12s infinite}
@keyframes aDrive{0%{transform:translateX(-430px);animation-timing-function:cubic-bezier(.15,.7,.3,1)}18%{transform:translateX(0)}62%{transform:translateX(0);animation-timing-function:cubic-bezier(.6,0,.9,.5)}80%{transform:translateX(580px)}80.01%{transform:translateX(-430px)}100%{transform:translateX(-430px)}}
.scene .a-wheel{transform-box:fill-box;transform-origin:center;animation:aWheel 12s infinite}
@keyframes aWheel{0%{transform:rotate(0);animation-timing-function:cubic-bezier(.15,.7,.3,1)}18%{transform:rotate(720deg)}62%{transform:rotate(720deg);animation-timing-function:cubic-bezier(.6,0,.9,.5)}80%{transform:rotate(3300deg)}100%{transform:rotate(3300deg)}}
.carbtn{position:absolute;left:20%;right:20%;top:28%;bottom:4%;background:transparent;border:0;border-radius:18px;cursor:pointer;z-index:3}
.carbtn:focus-visible{outline:3px solid var(--yel);outline-offset:-3px}
.hint{color:var(--muted);font-size:15px;margin-top:4px}
.scene .a-rumble{animation:aRumble .3s linear infinite}
@keyframes aRumble{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2px)}}
.scene .puff{transform-box:fill-box;transform-origin:center;animation:aPuff 2.4s ease-out infinite;opacity:0}
@keyframes aPuff{0%{transform:translate(0,0) scale(.4);opacity:.7}100%{transform:translate(-30px,-20px) scale(1.5);opacity:0}}
.scene .a-bob{animation:aBob 2.6s ease-in-out infinite}
@keyframes aBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.scene .a-swing{transform-origin:200px 24px;animation:aSwing 3.6s ease-in-out infinite}
@keyframes aSwing{0%,100%{transform:rotate(-2.4deg)}50%{transform:rotate(2.4deg)}}
@keyframes aTilt{0%,100%{transform:rotate(-2.6deg)}50%{transform:rotate(2.6deg)}}
.scene .a-blink{transform-box:fill-box;transform-origin:center;animation:aBlink 4.2s infinite}
@keyframes aBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.scene .a-wink{transform-box:fill-box;transform-origin:center;animation:aWink 5.2s infinite}
@keyframes aWink{0%,78%,100%{transform:scaleY(1)}84%,92%{transform:scaleY(.06)}}
.scene .a-sway-l{transform-origin:159px 106px;animation:aSway 2.1s ease-in-out infinite}
.scene .a-sway-r{transform-origin:241px 106px;animation:aSway 2.1s ease-in-out infinite reverse}
@keyframes aSway{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
.scene .a-pump{transform-origin:116px 240px;animation:aPump 1.2s ease-in-out infinite}
@keyframes aPump{0%,100%{transform:rotate(0)}50%{transform:rotate(-10deg)}}
.scene .a-float{transform-box:fill-box;transform-origin:center;animation:aFloat 4s ease-in-out infinite}
@keyframes aFloat{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}
.scene .cf{transform-box:fill-box;transform-origin:center;animation:aFall 6s linear infinite}
@keyframes aFall{0%{transform:translateY(-20px) rotate(0)}100%{transform:translateY(290px) rotate(540deg)}}
.scene .a-pulse{transform-box:fill-box;transform-origin:center;animation:aPulse 1.6s ease-in-out infinite}
@keyframes aPulse{0%,100%{transform:scale(.6);opacity:.4}50%{transform:scale(1.3);opacity:1}}
@media (prefers-reduced-motion:reduce){.scene *{animation:none!important}#party{display:none}}

/* ---------- toast & confetti ---------- */
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:18px;font-weight:600;max-width:min(92vw,520px);text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40}
#toast.show{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;top:-20px;font-size:26px;z-index:50;pointer-events:none;animation:fall 1.9s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}

/* ---------- motion (kept to one moment per scene) ---------- */
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.bob{animation:bob 3.2s ease-in-out infinite}
.tw{animation:twinkle 2.6s ease-in-out infinite}
.tw2{animation:twinkle 3.4s ease-in-out infinite .8s}
.bnc{animation:bounce .5s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.bob,.tw,.tw2,.bnc{animation:none}.confetti{display:none}#toast{transition:none}}
</style>
</head>
<body>
<svg aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden"><defs>
<radialGradient id="gBalloonR" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FF8A7A"/><stop offset="1" stop-color="#D62F2F"/></radialGradient>
<radialGradient id="gBalloonB" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#8DB6FF"/><stop offset="1" stop-color="#2F5FD6"/></radialGradient>
<radialGradient id="gBalloonY" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFE98A"/><stop offset="1" stop-color="#F2A81D"/></radialGradient>
<radialGradient id="gBalloonG" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#8DEBC2"/><stop offset="1" stop-color="#14A06F"/></radialGradient>
<linearGradient id="gGarden" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BFE3FF"/><stop offset=".45" stop-color="#DDF2C9"/><stop offset="1" stop-color="#6DBE62"/></linearGradient>
<linearGradient id="gCity" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7F9FC2"/><stop offset=".6" stop-color="#C9D6E2"/><stop offset="1" stop-color="#F0DCCB"/></linearGradient>
</defs></svg>
<div id="party" aria-hidden="true"></div>
<div id="app"><main id="page" aria-live="polite"></main></div>
<nav aria-label="Pages"><div class="in" id="tabs"></div></nav>
<div id="toast" role="status"></div>
<noscript>Please turn on JavaScript to use the Star Log.</noscript>

<script>
const SYNC_ENABLED = true;    /* true only in the "online" build */
const TEMPLATE = false;   /* the blank copy for another family is built with this set to true */
/* =====================================================================
   RIDHAAN'S STAR LOG  —  rebuilt from "Web_app_for_appreciation.xlsx"
   Assumptions taken from the workbook (kept as named constants):
   - 1 point = $0.01 (1 cent), changed from 5 cents in the Excel file
   - Starting points: reset to 0 for every activity (the Excel file had 100 + 100 each)
   - Points redeemed so far: reset to 0 (the Excel file had 20)
   - Piggy money: $50.00                 Excel: B7
   - Piggy expenses so far: $4.00        Excel: J15
   Everything new (awards, redeems, spending) is added on top of these.
   ===================================================================== */
let RATE_C = 1;              // cents per point (Mumma/Bapu can change it in the app)

const GROUPS = [], ACTS = {};
function rebuildActs(){
  GROUPS.length = 0; Object.keys(ACTS).forEach(k => delete ACTS[k]);
  GROUPS_BASE.forEach(g => {
    const ng = {id:g.id, name:(cfg.gnames && cfg.gnames[g.id]) || g.name, color:g.color, acts:[]};
    g.acts.forEach(a => ng.acts.push([a[0], (cfg.anames && cfg.anames[a[0]]) || a[1], a[2]]));
    (cfg.extra || []).filter(x => x.g === g.id).forEach(x => ng.acts.push([x.id, x.name, x.e || '⭐']));
    GROUPS.push(ng);
  });
  GROUPS.forEach(g => g.acts.forEach(a => { ACTS[a[0]] = {id:a[0], name:a[1], emoji:a[2], group:g}; }));
}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = c => (c < 0 ? '-' : '') + '$' + (Math.abs(c) / 100).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
const num = n => Number(n).toLocaleString('en-US');
const DEFAULT_NAMES = TEMPLATE ? {ridhaan:'Child', mumma:'Parent 1', bapu:'Parent 2'} : {ridhaan:'Ridhaan', mumma:'Mumma', bapu:'Bapu'};
const NAMES = Object.assign({}, DEFAULT_NAMES);
const WHO = { get m(){ return NAMES.mumma; }, get b(){ return NAMES.bapu; } };
const KEY2 = {ridhaan:'kid', mumma:'mum', bapu:'dad'};
function mkStore(key, dflt){
  return {key, read(){ try { return JSON.parse(localStorage.getItem(key)) || dflt(); } catch(e){ return dflt(); } },
          write(o){ try { localStorage.setItem(key, JSON.stringify(o)); } catch(e){ return false; } syncHook(key, o); return true; }};
}
const profStore = mkStore('ridhaan-star-profiles-v1', () => ({}));
const adminStore = mkStore('ridhaan-star-admin-v1', () => ({}));
let prof = Object.assign({names:{}, pics:{}}, profStore.read());
const _adm = adminStore.read();
let admin = Object.assign({partner:false, helpers:[]}, _adm);
if (_adm.partner === undefined && _adm.mumma) admin.partner = true;
delete admin.mumma;
const CFG_DEFAULTS = TEMPLATE
  ? {done:false, nick:'', carNo:'1', piggyC:0, expenseC:0, master:'bapu', noDefault:true, gnames:{}, anames:{}, extra:[], msgs:{}}
  : {done:true, nick:'Ridhu', carNo:'8', piggyC:5000, expenseC:400, master:'bapu', noDefault:false, gnames:{}, anames:{}, extra:[], msgs:{}};
const cfgStore = mkStore('ridhaan-star-config-v1', () => ({}));
let cfg = Object.assign({}, CFG_DEFAULTS, cfgStore.read());
const partnerId = () => cfg.master === 'bapu' ? 'mumma' : 'bapu';
function applyProfiles(){
  Object.keys(NAMES).forEach(k => { if (!(k in DEFAULT_NAMES)) delete NAMES[k]; });
  Object.keys(DEFAULT_NAMES).forEach(u => { NAMES[u] = (prof.names && String(prof.names[u] || '').trim()) || DEFAULT_NAMES[u]; });
  (admin.helpers || []).forEach(hp => { NAMES[hp.id] = hp.name; });
}
const defaultFace = u => (KEY2[u] && !cfg.noDefault) ? PHOTO[KEY2[u]].face : null;
const picFace = u => (prof.pics[u] && prof.pics[u].face) || defaultFace(u);
const picFull = u => (prof.pics[u] && prof.pics[u].full) || ((KEY2[u] && !cfg.noDefault) ? PHOTO[KEY2[u]].full : null);
const AVCOL = ['#2F6BFF', '#D63D78', '#0A8577', '#6A4BEF', '#D9480F'];
const avColor = u => AVCOL[Array.from(String(u)).reduce((a, ch) => a + ch.charCodeAt(0), 0) % AVCOL.length];
const initialOf = u => String(NAMES[u] || '?').trim().charAt(0).toUpperCase();
function av(u){
  const s = picFace(u);
  return s ? `<img class="face" alt="" src="${s}" width="100" height="100">` : `<span class="face initial" style="--c:${avColor(u)}">${esc(initialOf(u))}</span>`;
}
const isMaster = () => !!session && session.user === cfg.master;
const isHelper = u => (admin.helpers || []).some(hp => hp.id === u);
const isAdmin = () => !!session && (isMaster() || (session.user === partnerId() && admin.partner) || isHelper(session.user));
const allUsers = () => ['ridhaan', 'mumma', 'bapu'].concat((admin.helpers || []).map(hp => hp.id));
const fmtDate = ts => ts ? new Date(ts).toLocaleDateString(undefined, {day:'numeric', month:'short'}) : 'From my Excel log';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- storage: family sync (db) when available, else this device ---------- */
const local = {
  key: 'ridhaan-star-log-v2',
  read(){ try { return JSON.parse(localStorage.getItem(this.key)) || []; } catch(e){ return []; } },
  write(a){ try { localStorage.setItem(this.key, JSON.stringify(a)); } catch(e){ return false; } syncHook(this.key, a); return true; }
};
let mode = 'local', events = [], seen = new Set(), seenInit = false;

function clean(e){
  if (!e || typeof e !== 'object') return null;
  const t = e.type;
  if (!['award','adjust','redeem','expense','deposit'].includes(t)) return null;
  const o = {id:String(e.id || ''), type:t, ts:Number(e.ts) || 0, note:String(e.note || '').slice(0, 80)};
  if (t === 'award'){
    if (!ACTS[e.act] || !['b','m'].includes(e.who)) return null;
    o.act = e.act; o.who = e.who; o.pts = Math.trunc(Number(e.pts) || 0);
  } else if (t === 'adjust'){
    if (!ACTS[e.act] || !['b','m'].includes(e.who)) return null;
    o.act = e.act; o.who = e.who; o.delta = Math.trunc(Number(e.delta) || 0);
  } else if (t === 'redeem'){
    o.pts = Math.max(0, Math.floor(Number(e.pts) || 0));
  } else {
    o.cents = Math.max(0, Math.floor(Number(e.cents) || 0));
  }
  return o;
}
function setEvents(list){
  events = list.map(clean).filter(Boolean).filter(e => e.ts >= RESET_AT).sort((a,b) => a.ts - b.ts);
  if (!seenInit){ events.forEach(e => seen.add(e.id)); seenInit = true; }
  else {
    events.forEach(e => {
      if (!seen.has(e.id)){ seen.add(e.id); if (e.type === 'award') celebrate(e); }
    });
  }
  render();
}
async function storeAdd(ev){
  if (!session || (!isParent() && ev.type !== 'redeem')) throw {code:'denied'};
  const arr = local.read(); arr.push(ev); if (local.write(arr) === false) throw {code:'full'}; setEvents(arr);
}
async function storeRemove(id){
  if (!isParent()) throw {code:'denied'};
  const arr = local.read().filter(e => e.id !== id); local.write(arr); setEvents(arr);
}
function writeFailed(err){
  const c = err && err.code;
  toast(c === 'denied' ? 'Only ' + NAMES.mumma + ' and ' + NAMES.bapu + ' can change points.' : c === 'full'

/* ---------- parent PINs (stored as a one-way hash, never as plain text) ---------- */
const pinStore = {
  key: 'ridhaan-star-pins-v2',
  read(){ try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch(e){ return {}; } },
  write(o){ try { localStorage.setItem(this.key, JSON.stringify(o)); } catch(e){ return false; } syncHook(this.key, o); return true; }
};
let pins = Object.assign({mumma:null, bapu:null, ridhaan:null}, pinStore.read());
async function hashPin(user, pin){
  try {
    const d = new TextEncoder().encode('ridhaan-star-log|' + user + '|' + pin);
    const b = await crypto.subtle.digest('SHA-256', d);
    return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
  } catch(e){ return 'p:' + btoa(user + '|' + pin); }
}
async function savePin(user, hash){
  const o = pinStore.read(); o[user] = hash; pinStore.write(o);
  pins[user] = hash;
}

/* ---------- point value (cents per point) ---------- */
const setStore = {

};
(function(){ const s = setStore.read(); if (Number(s.rateC) > 0) RATE_C = Number(s.rateC); })();
const fmtRate = () => (Number.isInteger(RATE_C) ? String(RATE_C) : RATE_C.toFixed(2).replace(/0+$/, '')) + '¢';

  setStore.write({rateC:v});

}

/* ---------- maths (mirrors the Excel sheet) ---------- */
function compute(list){
  const tot = {};
  Object.keys(ACTS).forEach(k => tot[k] = {b:BASE.each, m:BASE.each});
  let redeemPts = BASE.redeemPts, spentC = cfg.expenseC, depC = 0;
  list.forEach(e => {
    if (e.type === 'award') tot[e.act][e.who] += e.pts;
    else if (e.type === 'adjust') tot[e.act][e.who] += e.delta;
    else if (e.type === 'redeem') redeemPts += e.pts;
    else if (e.type === 'expense') spentC += e.cents;
    else if (e.type === 'deposit') depC += e.cents;
  });
  let totalPts = 0;
  Object.values(tot).forEach(t => totalPts += t.b + t.m);
  const balPts = totalPts - redeemPts;
  const piggyInC = cfg.piggyC + depC;
  const piggyC = piggyInC - spentC;
  const pointsC = Math.round(balPts * RATE_C);
  return {tot, totalPts, redeemPts, balPts, totalValC: Math.round(totalPts * RATE_C), redeemValC: Math.round(redeemPts * RATE_C),
          pointsC, piggyInC, spentC, depC, piggyC, moneyC: pointsC + piggyC};
}

function histRow(it, canUndo){
  const ico = {redeem:'🎟️', expense:'🛍️', deposit:'🐷'}[it.type];
  const title = {redeem:'Redeemed ' + num(it.pts || 0) + ' points', expense:'Spent from piggy', deposit:'Added to piggy'}[it.type];
  const val = it.type === 'redeem' ? '− ' + money((it.pts||0)*RATE_C) : (it.type === 'expense' ? '− ' : '+ ') + money(it.cents||0);
  const cls = it.type === 'deposit' ? 'plus' : 'minus';
  return `<div class="cheer"><div class="ico" aria-hidden="true">${ico}</div>
    <div class="tx"><b>${title}</b><span>${fmtDate(it.ts)}${it.note ? ' · ' + esc(it.note) : ''}</span></div>
    <div class="pts ${cls}" style="color:inherit">${val}</div>
    ${canUndo && it.id ? `<button class="undo" data-a="undo" data-id="${esc(it.id)}" aria-label="Undo this entry">Undo</button>` : ''}</div>`;
}
function historyItems(){
  const base = [
    {type:'redeem', pts:BASE.redeemPts, ts:0, note:'', id:''},

    {type:'deposit', cents:cfg.piggyC, ts:0, note:'Piggy start', id:''}

function loadImg(file){
  return new Promise((res, rej) => { const u = URL.createObjectURL(file), im = new Image(); im.onload = () => { URL.revokeObjectURL(u); res(im); }; im.onerror = () => rej(new Error('bad image')); im.src = u; });
}
function drawCover(im, w, h2, fx, fy){
  const c = document.createElement('canvas'); c.width = w; c.height = h2; const x = c.getContext('2d');
  const s = Math.max(w / im.width, h2 / im.height), dw = im.width * s, dh = im.height * s;
  x.fillStyle = '#fff'; x.fillRect(0, 0, w, h2); x.drawImage(im, (w - dw) * fx, (h2 - dh) * fy, dw, dh); return c;
}
function sketchCanvas(src){
  const w = src.width, h2 = src.height;
  if (!('filter' in document.createElement('canvas').getContext('2d'))) return src;      // some browsers can't: keep the photo
  const mk = f => { const c = document.createElement('canvas'); c.width = w; c.height = h2; const x = c.getContext('2d'); x.filter = f; x.drawImage(src, 0, 0); x.filter = 'none'; return c; };
  const gray = mk('grayscale(1) contrast(1.1)'), inv = mk('grayscale(1) invert(1) blur(' + Math.max(3, Math.round(w / 70)) + 'px)');
  const out = document.createElement('canvas'); out.width = w; out.height = h2; const o = out.getContext('2d');
  o.drawImage(gray, 0, 0); o.globalCompositeOperation = 'color-dodge'; o.drawImage(inv, 0, 0);
  o.globalCompositeOperation = 'multiply'; o.fillStyle = '#FFFBF0'; o.fillRect(0, 0, w, h2); return out;
}
const origImgs = {};
const clampN = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
function cropPics(im, a, sketch){
  const W = im.width, H = im.height;
  let cw = Math.min(W, H * 0.8) / a.z, ch = cw / 0.8;
  const fx = W * a.x / 100, fy = H * a.y / 100;                       // the face the admin pointed at
  const sx = clampN(fx - cw / 2, 0, W - cw), sy = clampN(fy - ch * 0.32, 0, H - ch);
  let full = document.createElement('canvas'); full.width = 560; full.height = 700;
  let x = full.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, 560, 700); x.drawImage(im, sx, sy, cw, ch, 0, 0, 560, 700);
  const side = cw * 0.55, fsx = clampN(fx - side / 2, 0, W - side), fsy = clampN(fy - side / 2, 0, H - side);
  let face = document.createElement('canvas'); face.width = 240; face.height = 240;
  x = face.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, 240, 240); x.drawImage(im, fsx, fsy, side, side, 0, 0, 240, 240);
  if (sketch){ full = sketchCanvas(full); face = sketchCanvas(face); }
  return {full: full.toDataURL('image/jpeg', 0.82), face: face.toDataURL('image/jpeg', 0.84)};
}

const fx = {
  ctx: null,
  muted: (() => { try { return localStorage.getItem('ridhaan-star-mute') === '1'; } catch(e){ return false; } })(),
  ensure(){
    try {
      if (!this.ctx){ const C = window.AudioContext || window.webkitAudioContext; if (C) this.ctx = new C(); }
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    } catch(e){}
    return this.ctx;
  },
  clap(){
    if (this.muted) return;
    const ctx = this.ensure(); if (!ctx) return;
    try {
      const t0 = ctx.currentTime + 0.05, dur = 2.6, N = 70, sr = ctx.sampleRate;
      const buf = ctx.createBuffer(1, Math.floor(sr * 0.14), sr), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++){ const k = i / d.length; d[i] = (Math.random() * 2 - 1) * Math.pow(1 - k, 3.2); }
      const master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      for (let i = 0; i < N; i++){
        const x = Math.random(), t = t0 + x * dur, env = Math.sin(Math.PI * Math.min(1, x * 1.15)) * (1 - x * 0.5);
        const src = ctx.createBufferSource(); src.buffer = buf; src.playbackRate.value = 0.8 + Math.random() * 0.6;
        const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1200 + Math.random() * 1800; bp.Q.value = 0.9;
        const g = ctx.createGain(); g.gain.value = (0.35 + Math.random() * 0.5) * env;
        src.connect(bp); bp.connect(g); g.connect(master); src.start(t);
      }
    } catch(e){}
  },
  engine(t0, f0, f1, f2, dur, vol){
    const ctx = this.ctx, tp = t0 + dur * 0.5, end = t0 + dur;
    const master = ctx.createGain(); master.gain.value = 0.55; master.connect(ctx.destination);
    const o1 = ctx.createOscillator(), o2 = ctx.createOscillator(), lp = ctx.createBiquadFilter(), g = ctx.createGain(), lfo = ctx.createOscillator(), lg = ctx.createGain();
    o1.type = 'sawtooth'; o2.type = 'square';
    [[o1, 1], [o2, 0.5]].forEach(([o, m]) => { o.frequency.setValueAtTime(f0 * m, t0); o.frequency.exponentialRampToValueAtTime(f1 * m, tp); o.frequency.exponentialRampToValueAtTime(f2 * m, end); });
    lp.type = 'lowpass'; lp.Q.value = 3;
    lp.frequency.setValueAtTime(f0 * 4, t0); lp.frequency.exponentialRampToValueAtTime(f1 * 7, tp); lp.frequency.exponentialRampToValueAtTime(f2 * 4, end);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + dur * 0.16); g.gain.setValueAtTime(vol, t0 + dur * 0.72); g.gain.exponentialRampToValueAtTime(0.0001, end);

    o1.connect(lp); o2.connect(lp); lp.connect(g); g.connect(master);

    const nb = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.3), ctx.sampleRate), nd = nb.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / nd.length, 2);

    o1.start(t0); o2.start(t0); lfo.start(t0); ns.start(t0); o1.stop(end + 0.05); o2.stop(end + 0.05); lfo.stop(end + 0.05);
  },
  rev(kind){
    if (this.muted) return;
    const ctx = this.ensure(); if (!ctx) return;
    try {
      const t = ctx.currentTime + 0.03;
      if (kind === 'arrive') this.engine(t, 60, 300, 95, 1.7, 0.5);
      else if (kind === 'leave') this.engine(t, 90, 520, 320, 1.9, 0.55);
      else { this.engine(t, 70, 330, 100, 1.4, 0.55); this.engine(t + 1.65, 80, 280, 90, 0.95, 0.5); }

  },
  cycles: 0, timer: null,
  say(txt){

  },
  toggle(){

    if (this.muted){ try { window.speechSynthesis.cancel(); } catch(e){} }
  }
};
/* the Ferrari on the login page: engine noise in step with the drive-in and drive-off */
function driveCue(e){
  if (e.animationName !== 'aDrive') return;
  if (screen !== 'login' && screen !== 'auth') return;
  const t = (e.elapsedTime || 0) % 12;
  clearTimeout(fx.timer);
  if (t > 6){ if (fx.cycles <= 2) fx.rev('leave'); return; }
  if (fx.cycles >= 2) return;
  fx.cycles++;
  fx.rev('arrive');
  fx.timer = setTimeout(() => { if (screen === 'login' || screen === 'auth') fx.rev('leave'); }, Math.max(0, (7.4 - t) * 1000));
}

    cfg.msgs = cfg.msgs || {};
    Object.keys(MSG_DEFAULTS).forEach(k => {
      const v = (ui['ms_' + k] !== undefined ? ui['ms_' + k] : ((cfg.msgs && cfg.msgs[k]) || MSG_DEFAULTS[k])).trim().slice(0, 120);
      if (!v || v === MSG_DEFAULTS[k]) delete cfg.msgs[k]; else cfg.msgs[k] = v;
    });
    cfgStore.write(cfg); Object.keys(ui).filter(k => /^ms_/.test(k)).forEach(k => delete ui[k]); ui.pinMsg = ''; render(); toast('Welcome messages saved ✅');
  },
  async msgReset(){
    if (!isAdmin()) return;
    if (!await myPinOk(ui.pinMsg)){ toast('Type your PIN first.'); return; }
    cfg.msgs = {}; cfgStore.write(cfg); Object.keys(ui).filter(k => /^ms_/.test(k)).forEach(k => delete ui[k]); ui.pinMsg = ''; render(); toast('Welcome messages are back to the originals.');
  },
  fxToggle(){ fx.toggle(); render(); },
  fxHear(){ welcomeLadu(); confettiBurst(24); },
  homeRedeem(){ ui.wlFresh = false; ui.wlStage = 'points'; ui.wlPts = ''; ui.wlPin = ''; ui.wlErr = ''; screen = 'welcome'; render(); window.scrollTo(0, 0); },
  rowAward(el){ const a = ACTS[el.dataset.v]; ui.cat = a.group.id; ui.act = a.id; route = 'award'; render(); window.scrollTo(0, 0); },
  edCol(el){ ui.edCol = el.dataset.v; render(); },
  async edSave(){
    const a = ui.edAct, col = ui.edCol, nv = Math.floor(Number(ui.edNew));
    if (!(a && ACTS[a] && ui.edNew !== '' && nv >= 0)) return;
    if (!await myPinOk(ui.pinEd)){ toast('That PIN is not right.'); return; }
    const delta = nv - compute(events).tot[a][col];
    if (!delta){ toast('That is already the total. Nothing changed.'); return; }
    const ev = {id:uid(), type:'adjust', ts:Date.now(), act:a, who:col, delta, note:'Edited by ' + NAMES[session.user]};
    if (compute(events.concat([ev])).balPts < 0){ toast('That would take the points below zero.'); return; }
    try { await storeAdd(ev); ui.edNew = ''; ui.pinEd = ''; render(); toast(`${ACTS[a].name}: ${WHO[col]}'s points are now ${num(nv)} ✏️`); } catch(err){ writeFailed(err); }
  },
  async rateSave(){
    const v = Math.round(Number(ui.rateIn) * 100) / 100; if (!(v > 0 && v <= 10000)) return;
    if (!await myPinOk(ui.pinRate)){ toast('That PIN is not right.'); return; }
    try { await saveRate(v); ui.rateIn = ''; ui.pinRate = ''; render(); toast(`Point value is now ${fmtRate()} 🪙`); } catch(err){ writeFailed(err); }
  },
  async kidReset(){
    if (!await myPinOk(ui.pinKid)){ toast('That PIN is not right.'); return; }
    try {
      { const o = pinStore.read(); delete o.ridhaan; pinStore.write(o); }
      pins.ridhaan = null; ui.pinKid = ''; render(); toast(NAMES.ridhaan + ' will make a new PIN next time he logs in.');
    } catch(err){ writeFailed(err); }
  },
  wlNo(){ enterApp(); },
  wlFinish(){ enterApp(); },
  wlChip(el){ ui.wlPts = String(el.dataset.v); const i = $('#wlIn'); if (i) i.value = ui.wlPts; refresh(); },
  async wlRedeem(){
    const c = compute(events), n = Math.floor(Number(ui.wlPts)) || 0; if (!(n > 0 && n <= c.balPts)) return;
    const kid = session.user === 'ridhaan', needPin = kid || !ui.wlFresh;
    if (kid){
      if (!pins.mumma && !pins.bapu){ ui.wlErr = NAMES.mumma + ' or ' + NAMES.bapu + ' must set up a PIN first.'; refresh(); return; }
      const hm = await hashPin('mumma', ui.wlPin), hb = await hashPin('bapu', ui.wlPin);
      if (!((pins.mumma && hm === pins.mumma) || (pins.bapu && hb === pins.bapu))){ ui.wlErr = 'That parent PIN is not right.'; refresh(); return; }
    } else if (needPin && !await myPinOk(ui.wlPin)){ ui.wlErr = 'That PIN is not right.'; refresh(); return; }
    try {
      await storeAdd({id:uid(), type:'redeem', ts:Date.now(), pts:n, note: kid ? 'Asked by ' + NAMES.ridhaan + ', approved' : 'By ' + NAMES[session.user]});
      ui.wlDone = n; ui.wlStage = 'done'; ui.wlPts = ''; ui.wlPin = ''; ui.wlErr = ''; render(); confettiBurst(30); fx.clap();
    } catch(err){ writeFailed(err); }
  },
  cat(el){ ui.cat = el.dataset.v; const g = GROUPS.find(x => x.id === ui.cat); ui.act = g.acts.length === 1 ? g.acts[0][0] : ''; render(); },
  act(el){ ui.act = el.dataset.v; render(); },
  amt(el){ ui.amt = Number(el.dataset.v); ui.custom = ''; render(); },
  rdChip(el){ ui.rd = String(el.dataset.v); const i = $('#rdIn'); if (i) i.value = ui.rd; refresh(); },
  async award(){
    const n = amtVal(); if (!(isParent() && ui.act && n)) return;
    if (!await myPinOk(ui.pinAw)){ toast('That PIN is not right.'); return; }
    const ev = {id:uid(), type:'award', ts:Date.now(), who:myWho(), act:ui.act, pts:n, note:ui.note.trim()};
    if (n < 0 && compute(events.concat([ev])).balPts < 0){ toast('That would take the points below zero. There are ' + num(compute(events).balPts) + ' points now.'); return; }
    try { await storeAdd(ev); ui.act = ''; ui.note = ''; ui.pinAw = ''; ui.cat = ui.cat === 'others' ? '' : ui.cat; render(); } catch(err){ writeFailed(err); }
  },
  async redeem(){
    const c = compute(events), n = Math.floor(Number(ui.rd)) || 0; if (!(isParent() && n > 0 && n <= c.balPts)) return;
    if (!await myPinOk(ui.pinRd)){ toast('That PIN is not right.'); return; }
    try { await storeAdd({id:uid(), type:'redeem', ts:Date.now(), pts:n, note:ui.rdNote.trim()}); ui.rd = ''; ui.rdNote = ''; ui.pinRd = ''; render(); toast(`Redeemed ${num(n)} points for ${money(n*RATE_C)} 🎟️`); } catch(err){ writeFailed(err); }
  },
  async spend(){
    const c = compute(events), v = Math.round(Number(ui.sp) * 100) || 0; if (!(v > 0 && v <= c.piggyC)) return;
    try { await storeAdd({id:uid(), type:'expense', ts:Date.now(), cents:v, note:ui.spNote.trim()}); ui.sp = ''; ui.spNote = ''; render(); toast(`Recorded ${money(v)} spent from the piggy 🛍️`); } catch(err){ writeFailed(err); }
  },
  async deposit(){
    const v = Math.round(Number(ui.dp) * 100) || 0; if (!(v > 0)) return;
    try { await storeAdd({id:uid(), type:'deposit', ts:Date.now(), cents:v, note:ui.dpNote.trim()}); ui.dp = ''; ui.dpNote = ''; render(); toast(`Added ${money(v)} to the piggy 🐷`); } catch(err){ writeFailed(err); }
  },
  async undo(el){
    const id = el.dataset.id, rest = events.filter(e => e.id !== id), c = compute(rest);
    if (c.balPts < 0 || c.piggyC < 0) { toast('Cannot undo that one: points or piggy money would go below zero.'); return; }
    try { await storeRemove(id); toast('Undone.'); } catch(err){ writeFailed(err); }
  }
};
document.addEventListener('click', e => { const el = e.target.closest('[data-a]'); if (el && actions[el.dataset.a]) actions[el.dataset.a](el); });
document.addEventListener('input', e => {
  const ad = e.target.dataset && e.target.dataset.adj;
  if (ad){ const [u, k] = ad.split('.'); if (ui.adj[u]){ ui.adj[u][k] = Number(e.target.value); adjustPic(u); } return; } const k = e.target.dataset && e.target.dataset.bind; if (k){ ui[k] = e.target.value; refresh(); } });
document.addEventListener('change', async e => {
  const t = e.target; if (!t || !t.dataset) return;
  if (t.dataset.file && t.files && t.files[0]){
    try { const u = t.dataset.file, im = await loadImg(t.files[0]); origImgs[u] = im; ui.adj[u] = {z:1, x:50, y:30}; ui.pend[u] = cropPics(im, ui.adj[u], ui.sketch); render(); } catch(err){ toast('That picture could not be read. Try a JPG or PNG.'); }
  } else if (t.dataset.restore && t.files && t.files[0]){
    try {
      const d = JSON.parse(await t.files[0].text());
      if (!d || d.app !== 'ridhaan-star-log') throw new Error('not ours');
      ui.restoreData = d; ui.restoreName = t.files[0].name; render();
    } catch(err){ ui.restoreData = null; toast('That is not a backup file from this app.'); render(); }
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'pinIn') actions.authNext(); });

/* ---------- start ---------- */
rebuildActs();
applyProfiles();
if (!cfg.done) screen = 'setup';
if (SYNC_ENABLED){
  const d = parseLink(location.hash);
  if (d && !sync.on){ ui.cn_url = d.u; ui.cn_code = d.c; ui.cnErr = 'Link found. Press Connect to join this family.'; screen = 'connect'; }
}
setEvents(local.read());
if (SYNC_ENABLED && sync.on){ startPolling(); setTimeout(syncPull, 300); }
</script>
</body>
</html>
